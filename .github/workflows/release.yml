# Everything a v* tag produces: the macOS app, the Linux server for Jetsons
# and PCs, and the GitHub release that carries them.
# A push to main builds the Linux server too and puts it on the edge
# prerelease under fixed names, which is what `install.sh --ref main` installs,
# unless the push changed only the comma's side (ci.yml's filter, repeated
# here): the server is the same, so edge keeps the build it has.
#
# Signing and notarizing need six secrets (docs/publishing.md lists them). With
# none of them the build still runs and produces an ad hoc signed zip labelled
# unsigned, so a fork can cut its own release.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  # a newer push to main replaces an edge build still running; a tag finishes
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: write
  id-token: write

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      # a tag builds everything; main only what the server is built from
      server: ${{ github.ref_type == 'tag' || steps.filter.outputs.apps == 'true' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Sort the changed files
        id: filter
        if: github.ref_type == 'branch'
        uses: dorny/paths-filter@v4
        with:
          # every: a file counts only if it matches every line below, so the
          # '!' lines exclude. With the default, some, each line matches on
          # its own and '!docs/**' alone would match README.md.
          predicate-quantifier: every
          # Everything rebuilds the apps and the servers except the comma's
          # side, which the comma takes as a git pin and nothing builds: the
          # comma and openpilot packages, their tests, the root script and
          # the bench tools, the installer and the host CLI, and the docs.
          # jetlink/transport and protocol.py are the wire and stay in.
          filters: |
            apps:
              - '**'
              - '!jetlink/comma/**'
              - '!jetlink/openpilot/**'
              - '!scripts/comma/**'
              - '!scripts/deploy_to_comma.sh'
              - '!scripts/jetlink'
              - '!install.sh'
              - '!tests/comma_fakes.py'
              - '!tests/test_comma_*.py'
              - '!tests/openpilot/**'
              - '!tests/installer/**'
              - '!docs/**'
              - '!**/*.md'

  check:
    name: Check the tag
    # everything but the Linux server hangs off this, so a push to main builds
    # only that
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check the tag matches the package version
        run: macos/scripts/check-version.sh "${GITHUB_REF_NAME}"

  macos-app:
    name: macOS app
    needs: check
    runs-on: macos-26
    env:
      HAVE_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.NOTARY_KEY_ID != '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Report the signing mode
        run: |
          if [ "$HAVE_SIGNING" = "true" ]; then
            echo "signing with a Developer ID certificate and notarizing"
          else
            echo "no signing secrets: this build will be ad hoc signed and labelled unsigned"
          fi

      - name: Import the signing certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_PRIVATE_KEY_P8_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "error: the keychain has no Developer ID Application identity" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "$NOTARY_PRIVATE_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and sign the app
        run: |
          # SIGN_IDENTITY is in the environment only when the step above ran;
          # the scripts default it to "-" (ad hoc) otherwise.
          make -C macos app

      - name: Check the app serves
        run: make -C macos smoke
        # The signed bundle's Swift server over TCP on a scratch cache: hello
        # and ping over the wire protocol, then SIGTERM ends it.

      - name: Notarize the app
        if: env.HAVE_SIGNING == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: make -C macos notarize

      - name: Build the DMG and the zip
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # notarize.sh leaves its submission archive behind; it is not a
          # release artifact and it matches the upload pattern.
          rm -f macos/build/Jetlink-notarize.zip
          make -C macos dmg

      - name: Label an unsigned build
        if: env.HAVE_SIGNING != 'true'
        run: |
          # An ad hoc signature cannot be notarized, so a DMG of it would only
          # invite people to install something Gatekeeper refuses. Ship the zip
          # alone; the release job reads a missing DMG as an unsigned build.
          cd macos/build
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Jetlink.app/Contents/Info.plist)"
          rm -f "Jetlink-$VERSION-macOS.dmg"
          shasum -a 256 "Jetlink-$VERSION-macOS.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Delete the temporary keychain
        if: always()
        run: |
          # KEYCHAIN_PATH is set by the import step, so it is empty when that
          # step did not run and this is a no-op.
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload the app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            macos/build/Jetlink-*.dmg
            macos/build/Jetlink-*.zip
            macos/build/SHA256SUMS

  linux-server:
    name: Linux server (${{ matrix.flavor }})
    needs: changes
    # a fork's main has no edge prerelease to fill
    if: needs.changes.outputs.server == 'true' && (github.ref_type == 'tag' || github.repository == 'zoompilot/jetlink')
    strategy:
      fail-fast: false
      matrix:
        include:
          # the Jetson build (TensorRT 10) and the PC build (TensorRT 11.3),
          # each on a native runner; 22.04's glibc runs on 22.04 and 24.04
          - flavor: linux-aarch64
            runner: ubuntu-22.04-arm
          - flavor: linux-x86_64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # NVIDIA's pinned header debs and onnxruntime's tarball
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jetlink-build
          key: jetlink-server-build-${{ matrix.flavor }}-${{ hashFiles('scripts/build-linux.sh') }}

      - name: Build the server
        run: scripts/build-linux.sh "$FLAVOR"
        # The one way the server is built, here, in a container on a Mac or on
        # a Jetson: dist/jetlink-server-<version>-<flavor>.tar.gz and its
        # .sha256. On a tag v<__version__> the version is the release's.

      - name: Check the tarball
        run: |
          set -euo pipefail
          # what install.sh checks, then the binary, which runs on this
          # runner: it is the flavor's processor
          (cd dist && sha256sum -c jetlink-server-*-"$FLAVOR".tar.gz.sha256)
          tar -xzf dist/jetlink-server-*-"$FLAVOR".tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/jetlink-server-*-"$FLAVOR"
          echo "SERVER_DIR=$PWD" >>"$GITHUB_ENV"
          [ -f bin/JetlinkKit_JetlinkStatusPage.resources/Resources/index.html ]
          [ "$(bin/jetlink-server --version)" = "$(cat VERSION)" ]
          bin/jetlink-server serve --help >/dev/null
          # no GPU here, so TensorRT has to say it cannot run
          if bin/jetlink-server backends --backend trt; then
            echo "error: backends --backend trt passed on a runner without a GPU" >&2
            exit 1
          fi

      - name: Check it loads on the other distributions
        run: |
          set -euo pipefail
          # The binary against each distribution's glibc, libstdc++ and
          # libcurl, which the installer supports untested on hardware. No GPU
          # in a container, so TensorRT has to fail for want of a driver, not
          # of a library. Debian's own image has no libcurl, so its buildpack
          # one with curl stands in; Arch has no arm64 image.
          images="buildpack-deps:bookworm-curl fedora:latest opensuse/tumbleweed"
          [ "$FLAVOR" = linux-x86_64 ] && images="$images archlinux:latest"
          for image in $images; do docker pull -q "$image" >/dev/null & done
          wait
          for image in $images; do
            echo "==> $image"
            rc=0
            out="$(docker run --rm -v "$SERVER_DIR:/srv:ro" "$image" /srv/bin/jetlink-server backends --backend trt 2>&1)" || rc=$?
            printf '%s\n' "$out"
            if [ "$rc" != 1 ] || [[ $out != *"no CUDA driver"* ]]; then
              echo "error: the server did not load on $image" >&2
              exit 1
            fi
          done

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-server-${{ matrix.flavor }}
          path: dist/jetlink-server-*
          if-no-files-found: error

  edge:
    name: Edge prerelease
    needs: linux-server
    if: github.ref == 'refs/heads/main' && github.repository == 'zoompilot/jetlink'
    runs-on: ubuntu-24.04
    steps:
      - name: Download the Linux server
        uses: actions/download-artifact@v4
        with:
          pattern: linux-server-*
          path: dist
          merge-multiple: true

      - name: Refresh the edge prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          set -euo pipefail
          # Fixed names: the installer finds main's build without knowing its
          # version.
          for arch in aarch64 x86_64; do
            found=(jetlink-server-*-linux-"$arch".tar.gz)
            if [ "${#found[@]}" != 1 ] || [ ! -f "${found[0]}" ]; then
              echo "error: wanted one linux-$arch tarball, found: ${found[*]}" >&2
              exit 1
            fi
            name="jetlink-server-edge-linux-$arch.tar.gz"
            mv "${found[0]}" "$name"
            sha256sum "$name" > "$name.sha256"
          done
          NOTES="Builds of main at ${GITHUB_SHA::7}, for testing. install.sh --ref main installs them."
          if gh release view edge >/dev/null 2>&1; then
            # the tag follows main
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/edge" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit edge --prerelease --notes "$NOTES"
          else
            gh release create edge --prerelease --title "Edge" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload edge --clobber jetlink-server-edge-linux-*

  release:
    name: GitHub release
    # The server is required: install.sh takes the newest release, so one
    # without it would stop every Linux install and update.
    needs: [macos-app, linux-server]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Named, not the whole run: the step below releases every file it
      # finds, so only what belongs on the release comes down.
      - name: Download the macOS app
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos-app

      - name: Download the Linux server
        uses: actions/download-artifact@v4
        with:
          pattern: linux-server-*
          path: artifacts/linux-server
          merge-multiple: true

      - name: List what is being released
        run: find artifacts -type f -exec ls -lh {} +

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mapfile -t FILES < <(find artifacts -type f | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "error: nothing to release" >&2
            exit 1
          fi
          # The notes are the tag's section of CHANGELOG.md, less the heading
          # the release title repeats and any trailing blank lines. A tag
          # without a section gets GitHub's generated notes.
          awk -v heading="Jetlink $GITHUB_REF_NAME" '
            section && /^Jetlink v[0-9]/ { exit }
            section && /^=+$/ { next }
            section && /^$/ { if (started) blank = blank "\n"; next }
            section { printf "%s%s\n", blank, $0; blank = ""; started = 1 }
            $0 == heading { section = 1 }
          ' CHANGELOG.md > changelog.md
          if [ -s changelog.md ]; then
            ARGS=(--notes-file changelog.md --title "Jetlink $GITHUB_REF_NAME")
          else
            ARGS=(--generate-notes --title "Jetlink $GITHUB_REF_NAME")
          fi
          # Both spellings of a prerelease: a hyphenated semver tag, and the
          # PEP 440 suffixes jetlink.__version__ carries (check-version.sh),
          # which have no hyphen.
          case "$GITHUB_REF_NAME" in
            *-*|*a[0-9]*|*b[0-9]*|*rc[0-9]*) ARGS+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${ARGS[@]}" "${FILES[@]}"

          # Append the footer to the notes, rather than
          # replacing them.
          NOTES="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          # The backticks below are Markdown, not command substitutions.
          # shellcheck disable=SC2016
          {
            printf '%s\n\n' "$NOTES"
            # The DMG when signed, else the zip.
            MAC="$(find artifacts/macos-app -name 'Jetlink-*-macOS.dmg' | head -1)"
            [ -n "$MAC" ] || MAC="$(find artifacts/macos-app -name 'Jetlink-*-macOS.zip' | head -1)"
            MAC="$(basename "$MAC")"
            printf '## Install\n\n'
            printf 'Mac (Apple silicon): [%s](https://github.com/%s/releases/download/%s/%s)\n\n' "$MAC" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$MAC"
            printf 'Jetson or Linux PC:\n\n'
            printf '```bash\ncurl -fsSL https://raw.githubusercontent.com/zoompilot/jetlink/main/install.sh | bash\n```\n\n'
            printf 'It picks the server build: `jetlink-server-%s-linux-aarch64` for a Jetson, `-linux-x86_64` for a PC.\n\n' "$VERSION"
            if [ "${MAC%.zip}" != "$MAC" ]; then
              printf '## Mac app is unsigned\n\n'
              printf 'macOS blocks the first open. Right-click Jetlink in Applications > **Open**, or **System Settings > Privacy & Security > Open Anyway**. Or:\n\n'
              printf '```bash\nxattr -d com.apple.quarantine /Applications/Jetlink.app\n```\n'
            fi
          } > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

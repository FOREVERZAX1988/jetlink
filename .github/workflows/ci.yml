# Lint and test on every push and pull request.
#
# The cheap jobs (ruff, pytest on Linux) report in about a minute. The app job
# is the slow one: it builds and ad hoc signs the bundle, then runs the Swift
# server out of it.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.6

      - name: Run ruff
        run: ruff check .
        # No `ruff format --check`: the tree is not formatted by ruff and
        # reformatting it would rewrite every file for no gain.

  installer:
    name: Installer and host scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          # what the installer runs or installs, and what the comma runs as
          # root; the bench scripts are not held to it yet
          shellcheck install.sh scripts/jetlink scripts/jetlink-run-server \
            scripts/jetlink-wake-setup.sh scripts/jetlink-poweroff.sh \
            scripts/comma/jetlink-root.sh docker/*.sh tests/installer/*.sh

      - name: Run the installer scenarios
        run: tests/installer/run.sh
        # The installer end to end in Ubuntu 24.04 and 22.04 containers, with
        # apt, systemd, docker and the Jetson tools replaced by stand-ins: a
        # JetPack 7.2 and a JetPack 6 Jetson, a PC, an update, an uninstall.

  python-test-linux:
    name: Python tests on Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package
        run: pip install -e ".[dev,ort]"

      - name: Run the tests
        run: python -m pytest -q
        # onnxruntime's CPU wheel is the one runtime here. The trt suites
        # skip themselves without TensorRT, but test_sleep drives the serve
        # loop, which needs a backend to select rather than a skip.

  python-test-macos:
    name: Python tests on macOS
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install libusb
        run: brew install libusb

      - name: Install the package and the fixture releases
        run: pip install -e ".[dev,ort,usb]" -r JetlinkKit/Scripts/fixture-pins.txt
        # The pins are the numpy, onnx, onnxruntime and protobuf the Swift
        # fixtures were made with, so tests/test_conformance.py compares every
        # file here instead of skipping the ones those releases decide.

      - name: Run the tests
        run: python -m pytest -q
        # onnxruntime on the CPU provider is real here, so the backend suites
        # run instead of skipping. test_conformance runs each fixture generator
        # into a temporary directory and compares the result byte for byte
        # with the committed files: a Python change that moves what the Swift
        # must match fails here. Regenerate, commit, and make the Swift pass
        # against the new files (docs/conformance.md).

  swift:
    name: Swift build and tests
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Regenerate the Xcode project
        run: make -C macos project

      - name: Check the committed project is fresh
        run: git diff --exit-code macos/Jetlink.xcodeproj
        # project.yml is the source of truth; the generated project is
        # committed so `open` works without xcodegen. Run `make -C macos
        # project` and commit the result when this fails.

      - name: Run the Swift tests
        run: make -C macos test

      - name: Run the JetlinkKit tests
        run: swift test --package-path JetlinkKit
        # The Swift server the iPhone runs, on onnxruntime's CPU provider:
        # wire bytes against protocol.py, the preparation byte for byte
        # against Python's, and whole-server runs against golden frames.

      - name: Check the committed iPhone project is fresh
        run: |
          make -C ios project
          git diff --exit-code ios/Jetlink.xcodeproj

      - name: Compile the iPhone app for iOS
        run: make -C ios typecheck
        # SwiftPM against the iPhone SDK, so it needs no iOS simulator runtime.

  swift-linux:
    name: Swift conformance on Linux
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run the portable modules' tests
        run: swift test --package-path JetlinkKit
        # Package.swift's Linux branch: JetlinkKit, JetlinkONNX, JetlinkRegistry
        # and the portable part of JetlinkServer (the wire, the TCP and USB
        # framing, the queues, the frame statistics), built with
        # swift-crypto. The conformance suites read the
        # same Python-written fixtures here as on macOS, so the drift check
        # holds on a second platform. Nothing deploys this build
        # (docs/conformance.md).

  swift-android:
    name: Swift server for Android
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    env:
      NDK_VERSION: "30.0.16248370"
      NDK_RELEASE: r30
      ONNXRUNTIME: "1.29.0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Cache the NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Download the NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_RELEASE}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/ndk
          mkdir -p /opt/android-ndk
          mv /tmp/ndk/android-ndk-${NDK_RELEASE} "/opt/android-ndk/${NDK_VERSION}"

      - name: Install the Swift SDK for Android
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.4.0-release/android-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_android.artifactbundle.tar.gz \
            --checksum 21fb555122a3d801ad943d48df7ebffdd8824de61c25c180bb792d3edaee0b43

      - name: Build libjetlink.so
        run: |
          curl -fsSL -o /tmp/onnxruntime.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android-qnn/${ONNXRUNTIME}/onnxruntime-android-qnn-${ONNXRUNTIME}.aar"
          ANDROID_NDK_HOME="/opt/android-ndk/${NDK_VERSION}" bash android/scripts/swift-build.sh "$PWD/swift-out" /tmp/onnxruntime.aar release
        # The whole server with JETLINK_ANDROID=1: the portable part the Linux
        # job tests, plus the session, the engine host, the QNN backend, the
        # usbfs pipes and the JNI bridge (android/README.md).

      - uses: actions/upload-artifact@v4
        with:
          name: libjetlink-arm64-v8a
          path: swift-out
          retention-days: 7

  android:
    name: Android app
    needs: swift-android
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: libjetlink-arm64-v8a
          path: swift-out

      - name: Unit tests and the release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -Pjetlink.prebuiltSwift="$GITHUB_WORKSPACE/swift-out"
        # The Kotlin tests parse the snapshot fixture the Swift suites write,
        # and check the gadget's IDs, the port and the onnxruntime release
        # against Pinned.swift.

      - uses: actions/upload-artifact@v4
        with:
          name: Jetlink-android
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  app:
    name: App bundle and smoke test
    runs-on: macos-26
    needs: [python-lint]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build the app
        run: make -C macos app
        # `app` depends on `project`, so this is the whole thing, ad hoc signed.

      - name: Check the app serves
        run: make -C macos smoke
        # The bundle's Swift server over TCP on a scratch cache: hello and ping
        # over the wire protocol, then SIGTERM ends it. No Python in
        # the app; the client is jetlink/protocol.py from this checkout.

      - name: Pack the app
        run: ditto -c -k --keepParent macos/build/Jetlink.app macos/build/Jetlink-unsigned.zip

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Jetlink-unsigned
          path: macos/build/Jetlink-unsigned.zip
          retention-days: 7

  swift-format:
    name: Swift formatting
    runs-on: macos-26
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Lint the Swift sources
        run: xcrun swift-format lint --strict --configuration macos/.swift-format --recursive macos/Jetlink macos/JetlinkTests JetlinkKit/Sources JetlinkKit/Tests ios/Jetlink
        # macos/.swift-format is the repo style: 2 spaces, 160 columns, and no
        # UseSynthesizedInitializer, because the event structs keep their
        # memberwise initializers on purpose (01-contracts.md section 7).

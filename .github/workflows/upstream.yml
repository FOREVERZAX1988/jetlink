# Holds jetlink/openpilot/stock.py to commaai/openpilot.
#
# stock.py is the one jetlink module that imports openpilot, inside its
# methods. scripts/upstream checks by AST and text alone (the checkout is data,
# never run) that every name it imports is still there with the parameters it
# calls it with, that the literals it writes out (the chestnut ids, the warp,
# the services, the fields engaged() reads) still match, that the upstream
# rules it copies still read the same, and that the modeld seam the forks'
# hook lines go into is still there.
#
# On a pull request that changes any of those, and on a push of main, against
# the pin in scripts/upstream/UPSTREAM_SHA, so the result is the change's
# alone. Weekly against master: red opens one issue (or refreshes it), green
# closes it and names the SHA to pin.
name: Upstream paths

on:
  push:
    branches: [main]
    paths:
      - jetlink/openpilot/stock.py
      - jetlink/openpilot/interface.py
      - scripts/upstream/**
      - .github/workflows/upstream.yml
  pull_request:
    paths:
      - jetlink/openpilot/stock.py
      - jetlink/openpilot/interface.py
      - scripts/upstream/**
      - .github/workflows/upstream.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      rev:
        description: "openpilot revision to check (empty: the pin)"
        required: false
        default: ""

concurrency:
  group: upstream-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # with pipefail: a checker's exit survives the tee
    shell: bash

jobs:
  upstream-paths:
    name: upstream-paths
    runs-on: ubuntu-24.04
    # a fork of this repo has no business checking master weekly
    if: github.event_name != 'schedule' || github.repository == 'zoompilot/jetlink'
    outputs:
      sha: ${{ steps.fetch.outputs.sha }}
      report: ${{ steps.summary.outputs.report }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch openpilot
        id: fetch
        env:
          REV: ${{ github.event_name == 'schedule' && 'master' || inputs.rev }}
        run: |
          CHECKOUT=$RUNNER_TEMP/openpilot REPORT=$RUNNER_TEMP/report.txt
          printf 'CHECKOUT=%s\nREPORT=%s\n' "$CHECKOUT" "$REPORT" >> "$GITHUB_ENV"
          sha=$(scripts/upstream/fetch.sh "$CHECKOUT" ${REV:+"$REV"})
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "commaai/openpilot $sha (${REV:-pinned})" | tee "$REPORT"

      - name: Check the imports
        run: python3 -I scripts/upstream/check_imports.py "$CHECKOUT" | tee -a "$REPORT"

      - name: Check the paths and values
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: python3 -I scripts/upstream/check_paths.py "$CHECKOUT" | tee -a "$REPORT"

      - name: Summarize
        id: summary
        if: ${{ !cancelled() }}
        env:
          SHA: ${{ steps.fetch.outputs.sha }}
          GREEN: ${{ job.status == 'success' }}
        run: |
          report=$(cat "$REPORT" 2>/dev/null || echo "no report: the fetch failed")
          {
            echo 'report<<END_OF_REPORT'
            echo "$report"
            echo 'END_OF_REPORT'
          } >> "$GITHUB_OUTPUT"
          {
            echo '```'
            echo "$report"
            echo '```'
            if [ "$GREEN" = true ] && [ -n "$SHA" ] && [ "$SHA" != "$(tr -d '[:space:]' < scripts/upstream/UPSTREAM_SHA)" ]; then
              echo "Green on $SHA. To move the pin: \`echo $SHA > scripts/upstream/UPSTREAM_SHA\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # the weekly result as one issue; the only job that may write issues
  issue:
    name: Weekly issue
    needs: upstream-paths
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.repository == 'zoompilot/jetlink' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "upstream-paths: stock.py no longer matches openpilot master"
      RESULT: ${{ needs.upstream-paths.result }}
      SHA: ${{ needs.upstream-paths.outputs.sha }}
      REPORT: ${{ needs.upstream-paths.outputs.report }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, refresh or close it
        run: |
          number=$(gh issue list --state open --limit 200 --json number,title --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ "$RESULT" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Green again on commaai/openpilot $SHA."
            fi
            exit 0
          fi
          {
            echo "The weekly check of jetlink/openpilot/stock.py against commaai/openpilot master failed ($RUN)."
            echo
            echo '```'
            echo "${REPORT:-no report: the check did not get that far}"
            echo '```'
            echo
            echo "Fix stock.py (or the checkers in scripts/upstream), then move scripts/upstream/UPSTREAM_SHA."
          } > "$RUNNER_TEMP/issue.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
